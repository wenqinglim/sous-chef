name: Claude PR Review

on:
  push:
    branches: [main]
    paths: ['.github/workflows/claude-review.yml']
  pull_request:
    types: [opened]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Bootstraps the claude-task label: issue-form `labels:` entries are only
  # applied if the label already exists in the repo, so without this the
  # template-driven issue → PR flow silently never triggers.
  setup-labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: 'claude-task' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: 'claude-task',
                color: '7057ff',
                description: 'A task for Claude to implement and open a PR for',
              });
            }

  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a read-only code reviewer for this pull request.
            Stack: Next.js + TypeScript (Prisma, Jest, Tailwind).

            Read CLAUDE.md at the repo root and treat its rules as the primary
            convention checklist. If absent, fall back to stack defaults.

            Review the PR diff for:
            - Correctness: logic errors, wrong types, null/undefined handling,
              missed edge cases, breakage in call sites of modified symbols.
            - Security: Prisma raw-query injection, missing auth on Next.js API
              routes, `dangerouslySetInnerHTML`, server-only env vars exposed to
              the client, unvalidated input at boundaries.
            - Conventions: everything CLAUDE.md mandates, plus TypeScript strict
              mode, no `any`, Jest coverage for behavior changes.
            - Tests: did behavior changes come with Jest updates?

            Post findings as inline PR comments using the inline comment tool.
            Group by severity — flag must-fix items clearly. Every comment must
            cite a specific file and line. Be specific: describe the fix, don't
            just say "sanitize" or "handle errors". Do not modify files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Issue → PR flow: issues opened via the "Ask Claude to build something"
  # template carry the claude-task label; Claude implements the request on a
  # claude/** branch and posts a create-PR link on the issue. @claude comments
  # on the issue thread steer follow-ups. Requires write access to trigger.
  # The three arms are mutually exclusive so one issue event starts at most
  # one run: template issues arrive as `labeled` (checking the added label,
  # not the full list, so unrelated label changes don't spin up runners);
  # `opened` handles @claude typed directly, but only when the claude-task
  # label is absent (a template issue fires opened AND labeled — without the
  # exclusion an @claude mention in a form field would run Claude twice).
  implement:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-task') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'claude-task') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request == null)
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-task

  mention-response:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
